<title>일본어 첫걸음 핸드북</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: grid-paper notebook, one phone-width column, pink sticky-note cards, bottom tab bar. */
:root{
  --bg:#f7f3f2; --grid:#eadfe0; --card:#ffffff; --line:#e4d7d8; --fg:#2b2326; --muted:#6f6468;
  --accent:#d9435a; --accent-ink:#b52e47; --on-accent:#ffffff; --note:#fbd9d6; --note-ink:#4b2128;
  --ok:#1f7a5a; --ok-soft:#d9efe5; --bad:#b3372b; --bad-soft:#f8dcd7; --shadow:rgba(80,30,40,.16);
  --disp:'Jua','Noto Sans KR',system-ui,sans-serif;
  --ko:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1718; --grid:#2a2224; --card:#262021; --line:#3c3032; --fg:#f4ecec; --muted:#ac9ea1;
  --accent:#f06b7e; --accent-ink:#ff8d9c; --on-accent:#2a0f15; --note:#4a2830; --note-ink:#ffe3e1;
  --ok:#62caa0; --ok-soft:#1d3a2e; --bad:#ff8c7b; --bad-soft:#4a2824; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1718; --grid:#2a2224; --card:#262021; --line:#3c3032; --fg:#f4ecec; --muted:#ac9ea1;
  --accent:#f06b7e; --accent-ink:#ff8d9c; --on-accent:#2a0f15; --note:#4a2830; --note-ink:#ffe3e1;
  --ok:#62caa0; --ok-soft:#1d3a2e; --bad:#ff8c7b; --bad-soft:#4a2824; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;color:var(--fg);font:16px/1.55 var(--ko)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[role=button]:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:480px;margin:0 auto;padding-block:22px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app.focus{padding-block:18px calc(28px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}

.h1{font:400 30px/1.2 var(--disp);text-wrap:balance}
.h2{font:400 20px/1.3 var(--disp)}
.cap{font-size:13px;color:var(--muted)}
.tag{display:inline-block;align-self:flex-start;background:var(--note);color:var(--note-ink);font:400 20px/1 var(--disp);
  padding:9px 22px 9px 14px;transform:rotate(-1.5deg);clip-path:polygon(0 0,100% 0,95% 100%,0 100%)}
.head{display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.note{background:var(--note);color:var(--note-ink);border-radius:6px 6px 6px 30px;box-shadow:0 8px 18px -8px var(--shadow)}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);font:400 17px var(--disp)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:active{transform:translateY(1px)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn.sm{width:40px;height:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:500 14px var(--ko)}
.chip[aria-pressed=true]{background:var(--note);border-color:var(--accent);color:var(--note-ink);font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:0 14px;min-height:38px;font:500 14px var(--ko)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}

.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.top{display:flex;align-items:center;gap:12px}
.cnt{font:400 15px var(--disp);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

.jw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.jk{font-family:var(--jp);font-weight:700}
.jr{font:500 .55em var(--jp);color:var(--muted);letter-spacing:.02em}
.note .jr{color:inherit;opacity:.75}
.chipt{display:inline-block;font:500 12px var(--ko);padding:3px 10px;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--line)}
.note .chipt{background:rgba(255,255,255,.55);color:var(--note-ink);border-color:transparent}

/* flashcard */
.fc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;
  min-height:min(54vh,430px);padding:26px 18px;cursor:pointer;user-select:none}
.fc .big{font-size:clamp(36px,12.5vw,58px);overflow-wrap:anywhere}
.fc .mean{font:400 clamp(26px,8vw,34px)/1.3 var(--disp);overflow-wrap:anywhere;text-wrap:balance}
.fc .hint{font-size:13px;opacity:.8}
.hl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;font-size:13px;
  background:rgba(255,255,255,.5);border-radius:8px;padding:10px 14px;width:100%;max-width:340px}
.hl b{font-weight:500;opacity:.8}
.hl .jk{font-size:17px}

/* lists */
.srch{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:0 14px;font:16px var(--ko)}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:12px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:64px}
.wrow .jk{font-size:20px}.wrow .jw{align-items:flex-start}
.wrow .m{font-size:14px;color:var(--muted);grid-column:1;overflow-wrap:anywhere}
.wrow .lv{grid-row:1/3;grid-column:2}
#wlist{display:flex;flex-direction:column;gap:8px}
.lv{display:inline-flex;gap:2px;align-items:flex-end}
.lv i{display:block;width:5px;height:12px;border-radius:1px;background:var(--line)}
.lv i.on{background:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.stat b{display:block;font:400 26px/1.2 var(--disp);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.big-n{font:400 56px/1 var(--disp);font-variant-numeric:tabular-nums}
.link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:60px}
.link small{display:block;color:var(--muted);font-size:13px}
.prog{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:13px}
.prog .bar{height:8px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-height:56px}
.sw i{flex:none;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .15s;box-shadow:0 1px 3px var(--shadow)}
.sw[aria-checked=true] i{background:var(--accent)}
.sw[aria-checked=true] i::after{transform:translateX(20px)}

/* quiz */
.q-word{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 14px}
.q-word .jk{font-size:clamp(32px,10vw,44px)}
.q-ask{font-size:15px;text-align:center;text-wrap:balance}
.q-ask b{font:400 18px var(--disp);color:var(--accent-ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:10px 16px;text-align:left;
  border:1.5px solid var(--line);border-radius:10px;background:var(--card);overflow-wrap:anywhere}
.opt .jw{align-items:flex-start}
.opt .jk{font-size:21px}
.opt .t{font-size:17px}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt .mk{flex:none;width:26px;height:26px}
.opt.ok .mk{color:var(--ok)}.opt.no .mk{color:var(--bad)}
.fb{border-radius:10px;padding:14px 16px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{font:400 18px var(--disp)}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--bad)}
.fb .jw{align-items:flex-start}.fb .jk{font-size:20px}
.score{font:400 64px/1 var(--disp);text-align:center;font-variant-numeric:tabular-nums}
.miss{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--line);align-items:center}

/* grammar ref */
.ref{background:var(--card);border:1px solid var(--line);border-radius:10px}
.ref summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:8px 16px;cursor:pointer;font:400 18px var(--disp)}
.ref summary::-webkit-details-marker{display:none}
.ref summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin:0 4px 4px 0}
.ref[open] summary::after{transform:rotate(-135deg);margin:4px 4px 0 0}
.ref .body{padding:0 16px 14px}
.ref .intro{font-size:14px;color:var(--muted);margin-bottom:6px}
.ref h4{margin:14px 0 2px;font:400 16px var(--disp);color:var(--accent-ink)}
.rw{display:grid;gap:2px;padding:10px 0;border-top:1px dashed var(--line)}
.rw .l{font-weight:700;font-size:14px}
.rw .r{font-size:13px;color:var(--muted)}
.rw .e{font:500 18px/1.9 var(--jp)}
.rw .k{font-size:13px;color:var(--muted)}

/* dialog */
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:66px}
.crow .no{font:400 13px var(--disp);color:var(--accent-ink);width:44px;line-height:1.2}
.crow .no b{display:block;font:400 22px var(--disp);color:var(--fg)}
.crow small{display:block;color:var(--muted);font-size:13px}
.done-dot{width:26px;height:26px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.ln{display:flex;flex-direction:column;gap:4px;max-width:94%;min-width:0}
.ln.r{margin-left:auto;align-items:flex-end}
.who{font:400 13px var(--disp);color:var(--muted)}
.bub{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;
  padding:8px 14px 10px;font:500 19px/2.1 var(--jp);overflow-wrap:anywhere}
.ln.r .bub{background:var(--note);color:var(--note-ink);border-color:transparent;border-radius:16px 4px 16px 16px}
.bub ruby rt{font-size:.5em;font-weight:500}
.kot{font:400 14px/1.5 var(--ko);margin-top:4px;opacity:.78}
.bubrow{display:flex;gap:6px;align-items:flex-start;min-width:0;width:100%}
.ln.r .bubrow{flex-direction:row-reverse}
.prompt{border:2px dashed var(--accent);border-radius:10px;padding:14px 16px;background:var(--card)}
.prompt .t{font:400 18px/1.5 var(--ko);font-weight:500}
.ans{min-height:84px;border:2px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--card)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pc{min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font:500 19px/1.9 var(--jp)}
.pc ruby rt{font-size:.5em}
.ans .pc{background:var(--note);color:var(--note-ink);border-color:transparent}
.ans.ok{border-color:var(--ok);border-style:solid}
.ans.no{border-color:var(--bad);border-style:solid}
.kobig{font:500 19px/1.5 var(--ko);text-align:center;text-wrap:balance}

/* nav + sheet */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#nav .tabs{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;padding:4px 0;font:400 13px var(--disp);color:var(--muted);border-radius:10px}
#nav button span.ic{display:grid;place-items:center;width:52px;height:30px;border-radius:99px}
#nav button[aria-current=page]{color:var(--accent-ink)}
#nav button[aria-current=page] span.ic{background:var(--note);color:var(--note-ink)}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(20,8,10,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet .big{font-size:clamp(34px,11vw,46px)}
.ft{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-top:1px dashed var(--line);align-items:center}
.ft .n{font-size:13px;color:var(--muted)}

async function flush(){
  if(!dbDoc)return;
  if(dbBusy){dbTimer=setTimeout(flush,800);return}
  dbBusy=true;dbDirty=false;
  try{await dbDoc.set({t:S.t,s:S})}catch(e){}
  dbBusy=false;if(dbDirty){dbTimer=setTimeout(flush,1500)}
}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use('db'),user=await claude.use('user');
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    dbDoc=ref;
    if(snap.exists){
      const d=snap.data();
      if(d&&d.s&&d.t>S.t){S=norm(d.s);S.t=d.t;lsSave();if(!ui.mode)render(false)}
      else if(S.t>(d&&d.t||0)){dbDirty=true;flush()}

  }catch(e){}
}

function answer(known){
  const s=ui.ss,id=s.q[s.i],t=today();
  const c=S.cards[id]||{b:0,d:t};

  else{c.b=1;c.d=t;s.no++;if(!s.retry[id]){s.retry[id]=1;s.q.push(id)}}
  S.cards[id]=c;touch();save();
  s.i++;s.flip=false;render(true);

/* ---------- quizzes ---------- */
function genVocab(cat,n){
  const p=pool(cat);
  return shuffle(p).slice(0,n).map(w=>{
    let same=p.filter(x=>x.id!==w.id&&x.m!==w.m&&x.t===w.t);
    if(same.length<3)same=p.filter(x=>x.id!==w.id&&x.m!==w.m);
    const ch=shuffle([w].concat(shuffle(same).slice(0,3)));
    return{kind:'vocab',w:w,ch:ch.map(x=>x.m),ans:ch.indexOf(w)};
  });
}
function genConj(f,n){
  const ts=f==='all'?['i','na','v','n']:[f];
  const items=[],seen=new Set();let g=0;
  while(items.length<n&&g++<400){
    const tk=pick(ts);
    const p=tk==='v'?W.filter(w=>w.t[0]==='v'):tk==='n'?NOUNS:W.filter(w=>w.t===tk&&!w.x);
    const w=pick(p),fk=pick(D[tk].order),key=w.id+fk;
    if(seen.has(key))continue;seen.add(key);
    const ch=choicesFor(w,fk),cr=conj(w,fk).r;
    items.push({kind:'conj',w:w,fk:fk,ch:ch,ans:ch.findIndex(x=>x.r===cr)});
  }
  return items;
}
function startQuiz(kind){
  const items=kind==='vocab'?genVocab(ui.cat,10):genConj(ui.gf,10);
  ui.qz={kind:kind,items:items,i:0,sel:null,score:0,miss:[]};
  ui.mode='quiz';render(true);
}

  }
  const it=z.items[z.i],w=it.w,done=z.sel!==null;

  if(it.kind==='conj'){

      +'<p class="q-ask">이 말을 <b>'+esc(d.n)+'</b> <span class="cap">('+esc(d.ko)+')</span><br>형태로 바꾸면?</p>';
    opts=it.ch.map((c,i)=>optBtn(i,jw(c),it,done,z.sel));

    opts=it.ch.map((c,i)=>optBtn(i,'<span class="t">'+esc(c)+'</span>',it,done,z.sel));

      fb='<div class="fb '+(ok?'ok':'no')+'" role="status"><h3>'+(ok?'정답이에요':'아쉬워요')+'</h3>'+(ok?'':'<div>정답 '+jw(cor)+'</div>')+'<div class="cap" style="color:inherit">'+esc(why)+'</div></div>';
    }else{
      fb='<div class="fb '+(ok?'ok':'no')+'" role="status"><h3>'+(ok?'정답이에요':'아쉬워요')+'</h3><div>'+jw(disp(w))+' = '+esc(w.m)+'</div>'+(ok?'':'')+'</div>';
    }
    fb+='<button class="btn p block" data-a="qnext">'+(z.i+1>=n?'결과 보기':'다음 문제')+'</button>';
  }
  return topbar+head+'<div class="opts" role="group" aria-label="보기">'+opts.join('')+'</div>'+fb;
}
function optBtn(i,html,it,done,sel){
  let cls='opt',mk='';
  if(done){if(i===it.ans){cls+=' ok';mk='<span class="mk">'+IC.check+'</span>'}else if(i===sel){cls+=' no';mk='<span class="mk">'+IC.close+'</span>'}}
  return '<button class="'+cls+'" data-a="pick" data-i="'+i+'" '+(done?'disabled':'')+'>'+html+mk+'</button>';
}
function pickAns(i){
  const z=ui.qz;if(z.sel!==null)return;
  const it=z.items[z.i],ok=i===it.ans;
  z.sel=i;S.q.n++;if(ok){S.q.ok++;z.score++}
  else{
    if(it.kind==='conj')z.miss.push({q:jw(disp(it.w)),a:'<span class="cap">'+esc(D[TK(it.w)].f[it.fk].n)+'</span><br>'+jw(conj(it.w,it.fk))});
    else z.miss.push({q:jw(disp(it.w)),a:esc(it.w.m)});
  }
  touch();save();render(false);
}

/* ---------- views: grammar ---------- */
function refRows(rows){
  return rows.map(r=>'<div class="rw"><span class="l">'+rb(r[0])+'</span><span class="r">'+rb(r[1])+'</span><span class="e">'+rb(r[2])+'</span><span class="k">'+esc(r[3])+'</span></div>').join('');
}
function rGrammar(){
  const F=[['all','전체'],['i','い형용사'],['na','な형용사'],['v','동사'],['n','명사']];
  return '<div class="head"><span class="tag">문법</span></div>'
  +'<section class="card" style="display:flex;flex-direction:column;gap:12px"><div><div class="h2">활용 연습</div><p class="cap">단어와 활용 이름을 보고 알맞은 모양을 골라요.</p></div>'
  +'<div class="chips" role="group" aria-label="연습 범위">'+F.map(f=>'<button class="chip" data-a="gf" data-v="'+f[0]+'" aria-pressed="'+(ui.gf===f[0])+'">'+f[1]+'</button>').join('')+'</div>'
  +'<button class="btn p block" data-a="go-gq">10문제 시작</button></section>'
  +'<div style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">정리 노트</h2>'
  +REF.map((t,ti)=>'<details class="ref"><summary>'+esc(t.h)+'</summary><div class="body"><p class="intro">'+rb(t.intro)+'</p>'+t.s.map(s=>(s.t?'<h4>'+esc(s.t)+'</h4>':'')+refRows(s.rows)).join('')+'</div></details>').join('')+'</div>';
}

/* ---------- views: talk ---------- */
function rTalkList(){
  return '<div class="head"><span class="tag">회화</span><p class="cap">본책의 회화 15개를 읽고, 역할을 맡아 말하고, 문장을 맞춰 봐요.</p></div>'
  +'<div style="display:flex;flex-direction:column;gap:8px">'+DLG.map(c=>'<button class="crow" data-a="dlg" data-n="'+c.n+'"><span class="no">CH<b>'+c.n+'</b></span><span><b>'+esc(c.t)+'</b><small>본책 '+c.p+'p · '+esc(c.g)+'</small></span>'+(S.dl.done[c.n]?'<span class="done-dot" aria-label="완료">'+IC.check+'</span>':'<span></span>')+'</button>').join('')+'</div>';
}
const lineHtml=(l,i,cls)=>{
  const left=l.s==='シウ',key=ui.dn+'-'+i,showK=ui.kor||ui.kl[key];
  const ja=l.t.map(p=>rb(p[0])).join(' ');
  const ko=l.t.map(p=>esc(p[1])).join(' ');
  return '<div class="ln '+(left?'':'r')+'"><span class="who">'+esc(SP[l.s]||l.s)+'</span><div class="bubrow"><button class="bub" data-a="kl" data-k="'+key+'" aria-label="번역 보기·숨기기">'+ja+(showK?'<div class="kot">'+ko+'</div>':'')+'</button>'+spkBtn(l.t.map(p=>rd(p[0])).join(' '))+'</div></div>';
};
function rDlg(){
  const c=DLG[ui.dn-1];
  const head='<div class="top"><button class="icon-btn" data-a="close" aria-label="목록으로">'+IC.back+'</button><div class="grow"><div class="cap">CHAPTER '+c.n+' · 본책 '+c.p+'p</div><h1 class="h2">'+esc(c.t)+'</h1></div></div>'
  +'<div class="seg" style="align-self:stretch" role="group" aria-label="학습 방식">'+[['read','읽기'],['role','역할 연습'],['arr','문장 배열']].map(m=>'<button style="flex:1" data-a="dm" data-v="'+m[0]+'" aria-pressed="'+(ui.dm===m[0])+'">'+m[1]+'</button>').join('')+'</div>';
  let body='';
  if(ui.dm==='read'){
    body='<button class="sw" role="switch" aria-checked="'+ui.kor+'" data-a="kor"><span><b>한국어 번역 보기</b></span><i></i></button>'
      +'<p class="cap">말풍선을 탭하면 그 줄의 번역만 보여요.</p>'
      +'<div style="display:flex;flex-direction:column;gap:14px">'+c.lines.map((l,i)=>lineHtml(l,i)).join('')+'</div>';
  }else if(ui.dm==='role')body=rRole(c);
  else body=rArr(c);
  return head+body;
}
function spkrs(c){const a=[];c.lines.forEach(l=>{if(a.indexOf(l.s)<0)a.push(l.s)});return a}
function rRole(c){
  const r=ui.rl;
  if(!r||!r.role){
    return '<p>맡을 역할을 고르세요. 상대방 대사는 보여 주고, 내 대사는 한국어를 보고 직접 말해 본 뒤 확인해요.</p><div class="opts">'+spkrs(c).map(s=>'<button class="btn block" data-a="role" data-s="'+esc(s)+'">'+esc(SP[s]||s)+' 역할</button>').join('')+'</div>';
  }
  const n=c.lines.length,out=[];
  for(let k=0;k<Math.min(r.i+1,n);k++){
    const l=c.lines[k];
    if(k===r.i&&l.s===r.role&&!r.rev){
      out.push('<div class="prompt"><div class="cap">내 차례 · '+esc(SP[l.s]||l.s)+'</div><div class="t">'+esc(l.t.map(p=>p[1]).join(' '))+'</div></div>');
    }else out.push(lineHtml(l,k));
  }
  let act='';
  if(r.i>=n){
    act='<section class="note" style="padding:18px;text-align:center"><div class="h2">연습 완료</div><p class="cap" style="color:inherit">'+esc(SP[r.role]||r.role)+' 역할을 끝까지 말했어요.</p></section><div class="btn2"><button class="btn" data-a="role" data-s="'+esc(r.role)+'">다시 하기</button><button class="btn p" data-a="role" data-s="">역할 바꾸기</button></div>';
  }else{
    const l=c.lines[r.i];
    act='<button class="btn p block" data-a="rnext">'+(l.s===r.role&&!r.rev?'정답 보기':(r.i>=lastUser(c,r.role)&&l.s===r.role?'마치기':'다음'))+'</button>';
  }
  return '<div class="cap">내 역할: '+esc(SP[r.role]||r.role)+'</div><div style="display:flex;flex-direction:column;gap:14px">'+out.join('')+'</div>'+act;
}
const lastUser=(c,role)=>{let x=-1;c.lines.forEach((l,i)=>{if(l.s===role)x=i});return x};
function roleStep(){
  const c=DLG[ui.dn-1],r=ui.rl,l=c.lines[r.i];
  if(l.s===r.role&&!r.rev){r.rev=true;return}
  r.rev=false;r.i++;
  while(r.i<c.lines.length&&c.lines[r.i].s!==r.role)r.i++;
  if(r.i>=c.lines.length){r.i=c.lines.length;S.dl.done[c.n]=true;touch();save()}
}
function roleStart(s){
  const c=DLG[ui.dn-1];
  if(!s){ui.rl=null;return}
  let i=0;while(i<c.lines.length&&c.lines[i].s!==s)i++;
  ui.rl={role:s,i:i,rev:false};
}
function arrSetup(){
  const a=ui.ar,it=a.items[a.i];
  let p;let g=0;
  do{p=shuffle(it.ch.map((t,id)=>({id:id,t:t})))}while(p.map(x=>x.t).join(' ')===it.ja&&g++<8);
  a.pool=p;a.ans=[];a.res=null;
}
function arrStart(){
  const c=DLG[ui.dn-1],items=[];
  const collect=min=>c.lines.forEach(l=>l.t.forEach(p=>{const ch=p[0].split(' ');if(ch.length>=min&&ch.length<=7)items.push({ja:p[0],ko:p[1],ch:ch})}));
  collect(3);if(items.length<3){items.length=0;collect(2)}
  ui.ar={items:shuffle(items).slice(0,8),i:0,ok:0,done:false,pool:[],ans:[],res:null};
  if(ui.ar.items.length)arrSetup();else ui.ar.done=true;
}
function rArr(c){
  if(!ui.ar||ui.ar.n!==c.n){arrStart();ui.ar.n=c.n}
  const a=ui.ar,n=a.items.length;
  if(a.done){
    if(n&&!S.dl.done[c.n]){S.dl.done[c.n]=true;touch();save()}
    return '<section class="note" style="padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:6px"><div class="h2">문장 배열 완료</div><div class="score">'+a.ok+'<span style="font-size:26px;opacity:.7"> / '+n+'</span></div><p class="cap" style="color:inherit">한 번에 맞힌 문장 수예요.</p></section><button class="btn p block" data-a="arrreset">다시 하기</button>';
  }
  const it=a.items[a.i];
  const chip=(x,where)=>'<button class="pc" data-a="'+where+'" data-id="'+x.id+'" '+(a.res&&where==='unplace'?'disabled':'')+'>'+rb(x.t)+'</button>';
  let h='<div class="row sp"><span class="cap">'+(a.i+1)+' / '+n+'</span><div class="bar" style="max-width:200px"><i style="width:'+Math.round(100*a.i/n)+'%"></i></div></div>'
   +'<p class="kobig">'+esc(it.ko)+'</p>'
   +'<div class="ans '+(a.res||'')+'" aria-label="내가 만든 문장">'+(a.ans.length?a.ans.map(x=>chip(x,'unplace')).join(''):'<span class="cap">아래 조각을 순서대로 눌러요</span>')+'</div>'
   +'<div class="pool">'+a.pool.map(x=>chip(x,'place')).join('')+'</div>';
  if(a.res==='ok')h+='<div class="fb ok" role="status"><h3>정답이에요</h3><div class="row">'+spkBtn(rd(it.ja))+'<span style="font:500 18px var(--jp)">'+rb(it.ja)+'</span></div></div><button class="btn p block" data-a="anext">'+(a.i+1>=n?'마치기':'다음 문장')+'</button>';
  if(a.res==='no')h+='<div class="fb no" role="status"><h3>순서가 달라요</h3><div class="cap" style="color:inherit">정답</div><div style="font:500 18px/2 var(--jp)">'+rb(it.ja)+'</div></div><div class="btn2"><button class="btn" data-a="aretry">다시 해보기</button><button class="btn p" data-a="anext">'+(a.i+1>=n?'마치기':'다음 문장')+'</button></div>';
  return h;
}
function arrPlace(id,place){
  const a=ui.ar;if(a.res)return;
  const from=place?a.pool:a.ans,to=place?a.ans:a.pool;
  const k=from.findIndex(x=>String(x.id)===id);if(k<0)return;
  to.push(from.splice(k,1)[0]);
  if(!a.pool.length){
    const it=a.items[a.i],ok=a.ans.map(x=>x.t).join(' ')===it.ja;
    a.res=ok?'ok':'no';
    if(ok&&!a.miss)a.ok++;
    if(!ok)a.miss=true;
  }
}

/* ---------- sheet ---------- */
function renderSheet(){
  const el=$('#sheet');
  if(!ui.sheet){el.hidden=true;el.innerHTML='';return}
  const w=ID[ui.sheet],d=disp(w),k=TK(w);
  let tbl='';
  if(w.x&&w.t==='na')tbl='<p class="cap">예외: 同じ는 명사를 꾸밀 때 な 없이 「同じ ＋ 명사」로 써요. 그 밖의 활용은 다른 な형용사와 같아요.</p>';
  else tbl=D[k].order.map(f=>{const x=D[k].f[f];return '<div class="ft"><div><b>'+esc(x.n)+'</b><div class="n">'+esc(x.ko)+'</div></div>'+jw(conj(w,f))+'</div>'}).join('');
  el.innerHTML='<div class="sheet-bg" data-a="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="단어 상세"><div class="row sp"><span class="chipt">'+tagOf(w)+'</span><div class="row">'+spkBtn(w.r)+'<button class="icon-btn sm" data-a="closeSheet" aria-label="닫기">'+IC.close+'</button></div></div>'
  +'<div style="text-align:center"><div class="big">'+jw(d)+'</div><div class="h2" style="margin-top:8px">'+esc(w.m)+'</div></div><div>'+tbl+'</div></div></div>';
  el.hidden=false;
}

/* ---------- render ---------- */
function render(top){
  const v=$('#view'),app=$('#app');
  app.classList.toggle('focus',!!ui.mode);
  $('#nav').hidden=!!ui.mode;
  let h;
  if(ui.mode==='session')h=rSession();
  else if(ui.mode==='quiz')h=rQuiz();
  else if(ui.mode==='dlg')h=rDlg();
  else h={home:rHome,vocab:rVocab,grammar:rGrammar,talk:rTalkList}[ui.tab]();
  v.innerHTML=h;
  $('#tabs').innerHTML=TABS.map(t=>'<button data-a="tab" data-v="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'><span class="ic">'+IC[t[2]]+'</span>'+t[1]+'</button>').join('');
  renderSheet();
  if(top)window.scrollTo(0,0);
}

/* ---------- events ---------- */
const A={
  tab:b=>{if(location.hash==='#'+b.dataset.v){ui.tab=b.dataset.v;ui.mode=null;render(true)}else location.hash=b.dataset.v},
  close:()=>{ui.mode=null;ui.sheet=null;render(true)},
  'go-session':b=>{if(b.dataset.cat)ui.cat=b.dataset.cat;startSession(ui.cat)},
  'go-vq':()=>startQuiz('vocab'),
  'go-gq':()=>startQuiz('conj'),
  cat:b=>{ui.cat=b.dataset.v;render(false)},
  gf:b=>{ui.gf=b.dataset.v;render(false)},
  flip:()=>{ui.ss.flip=!ui.ss.flip;render(false)},
  yes:()=>answer(true),
  no:()=>answer(false),
  dir:b=>{S.set.dir=b.dataset.v;save();render(false)},
  say:b=>say(b.dataset.t),
  pick:b=>pickAns(+b.dataset.i),
  qnext:()=>{ui.qz.i++;ui.qz.sel=null;render(true)},
  word:b=>{ui.sheet=b.dataset.id;renderSheet()},
  closeSheet:()=>{ui.sheet=null;renderSheet()},
  bg:(b,e)=>{if(e.target===b){ui.sheet=null;renderSheet()}},
  kana:()=>{S.set.kana=!S.set.kana;save();render(false)},
  dlg:b=>{ui.dn=+b.dataset.n;ui.dm='read';ui.rl=null;ui.ar=null;ui.kl={};ui.mode='dlg';S.dl.last=ui.dn;save();render(true)},
  dm:b=>{ui.dm=b.dataset.v;ui.rl=null;ui.ar=null;render(false)},
  kor:()=>{ui.kor=!ui.kor;render(false)},
  kl:b=>{const k=b.dataset.k;ui.kl[k]=!ui.kl[k];render(false)},
  role:b=>{roleStart(b.dataset.s);render(true)},
  rnext:()=>{roleStep();render(false)},
  place:b=>{arrPlace(b.dataset.id,true);render(false)},
  unplace:b=>{arrPlace(b.dataset.id,false);render(false)},
  aretry:()=>{ui.ar.miss=true;arrSetup();render(false)},
  anext:()=>{const a=ui.ar;a.i++;a.miss=false;if(a.i>=a.items.length){a.done=true}else arrSetup();render(true)},
  arrreset:()=>{ui.ar=null;render(true)}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=A[b.dataset.a];if(f)f(b,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='q'){ui.q=e.target.value;const l=$('#wlist');if(l)l.innerHTML=listHtml()}
});
function route(){
  const h=(location.hash||'').replace('#','');
  ui.tab=TABIDS.indexOf(h)>=0?h:'home';ui.mode=null;ui.sheet=null;render(true);
}
window.addEventListener('hashchange',route);
route();
initDb();
if(TTS){try{speechSynthesis.getVoices()}catch(e){}}
})();
</script>

</body>
</html>
